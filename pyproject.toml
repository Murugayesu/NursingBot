[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*", "scripts*"]

[project]
name = "rag-platform"
version = "0.1.0"
description = "Reusable, configuration-driven RAG platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",   # file uploads

    # ── Database ─────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",            # async Postgres driver (FastAPI)
    "psycopg2-binary>=2.9.0",     # sync driver for Alembic migrations
    "alembic>=1.14.0",

    # ── Config / validation ──────────────────────────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",

    # ── LangChain ecosystem ──────────────────────────────────────────────────
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",

    # ── Vector DB ────────────────────────────────────────────────────────────
    "qdrant-client>=1.12.0",

    # ── Embeddings — BGE-M3 (local, via sentence-transformers) ───────────────
    "sentence-transformers>=3.0.0",
    "torch>=2.5.0",

    # ── Reranker — Jina v2 (local via transformers) ──────────────────────────
    "transformers>=4.46.0",
    "einops>=0.8.0",              # required by jina reranker

    # ── LLM — OpenAI-compatible (via langchain-openai) ───────────────────────
    "openai>=1.58.0",             # transitive dep of langchain-openai

    # ── Document loaders (used by langchain-community loaders) ───────────────
    "pymupdf>=1.24.0",            # PyMuPDFLoader
    "beautifulsoup4>=4.12.0",     # BSHTMLLoader
    "lxml>=5.3.0",                # HTML parser backend
    "unstructured>=0.16.0",       # UnstructuredMarkdownLoader
    "chardet>=5.2.0",             # encoding detection (TextLoader)

    # ── Sparse retrieval (SPLADE via fastembed) ───────────────────────────────
    "fastembed>=0.4.0",

    # ── Observability ────────────────────────────────────────────────────────
    "langfuse>=4.0.0",

    # ── Evaluation ───────────────────────────────────────────────────────────
    "ragas>=0.2.0",
    "datasets>=3.2.0",

    # ── Utilities ────────────────────────────────────────────────────────────
    "httpx>=0.28.0",
    "anyio>=4.7.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",             # TestClient
    "factory-boy>=3.3.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
